<!doctype html>
<!--
  GENERATED. Do not edit this file: it is rebuilt from PRIVACY.md in
  https://github.com/parl0v/ludusctrl by .github/workflows/privacy.yml, and
  any change here is overwritten. Edit PRIVACY.md there instead.

  Accurate while the app ships with no ads and no third-party SDKs. Adding an
  ad SDK falsifies the "collects nothing" and "no third parties" claims, and
  Play cross-checks the Data Safety declaration against the uploaded build,
  so the policy cannot be the only thing that changes.

<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/ludusctrl/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/ludusctrl/apple-touch-icon.png">
<title>Privacy Policy — LudusCtrl</title>
<meta name="description" content="LudusCtrl privacy policy. The app and the Windows receiver collect no personal data.">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1d23;
    --muted: #5c6470;
    --rule: #e2e5ea;
    --accent: #1b6fc4;
    --card: #f5f7fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e14;
      --fg: #e8edf5;
      --muted: #8a94a6;
      --rule: #232a36;
      --accent: #2e9bff;
      --card: #141922;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.25rem 5rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { font-size: 1.8rem; line-height: 1.2; margin: 0 0 .35rem; }
  h2 {
    font-size: 1.1rem; margin: 2.4rem 0 .6rem;
    padding-top: 1.4rem; border-top: 1px solid var(--rule);
  }
  .updated { color: var(--muted); font-size: .9rem; margin: 0 0 2rem; }
  .lede {
    background: var(--card); border-left: 3px solid var(--accent);
    padding: 1rem 1.15rem; border-radius: 0 6px 6px 0; margin: 0 0 1.5rem;
  }
  .lede strong { display: block; font-size: 1.05rem; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .94rem; }
  th, td { text-align: left; padding: .6rem .7rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  code {
    background: var(--card); padding: .12em .4em; border-radius: 4px;
    font: .88em ui-monospace, Consolas, monospace;
    overflow-wrap: anywhere;
  }
  a { color: var(--accent); }
  footer { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .9rem; }
</style>

<main>
{{content}}
  <footer>
    <p>This policy is also kept in the receiver's source repository:
    <a href="https://github.com/parl0v/ludusctrl/blob/main/PRIVACY.md">PRIVACY.md</a>.</p>
    LudusCtrl is not affiliated with, endorsed by, or sponsored by Sony
    Interactive Entertainment, Microsoft, or Nintendo. Product names are used
    only to identify compatible hardware.
  </footer>
</main>
