# Rebuilds ludusctrl/docs/privacy.html from PRIVACY.md in parl0v/ludusctrl,
# which is the only copy anyone edits. Runs daily, on demand
# (gh workflow run privacy.yml -R parl0v/parl0v.github.io), and when the
# renderer or its template change. Commits only when the page changed.

name: Privacy policy

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/privacy/**"
      - ".github/workflows/privacy.yml"

permissions:
  contents: write

concurrency:
  group: privacy
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the renderer
        run: python -m pip install "markdown==3.10"
      - name: Render PRIVACY.md
        run: python .github/privacy/render.py
      - name: Commit if the page changed
        run: |
          if git diff --quiet -- ludusctrl/docs/privacy.html; then
            echo "Privacy page unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ludusctrl/docs/privacy.html
          git commit -m "LudusCtrl privacy policy: rebuild from PRIVACY.md"
          git push
