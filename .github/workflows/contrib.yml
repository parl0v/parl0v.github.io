# Rebuilds anyps5/index.html and the PR counts on the homepage and in
# llms.txt from the GitHub API. Runs daily, on demand
# (gh workflow run contrib.yml -R parl0v/parl0v.github.io), and when the
# renderer or its notes change. Commits only when a page changed.

name: AnyPS5 contributions

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/contrib/**"
      - ".github/workflows/contrib.yml"

permissions:
  contents: write

concurrency:
  group: contrib
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Render the contributions page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/contrib/render.py
      - name: Commit if a page changed
        run: |
          if git diff --quiet -- anyps5/index.html index.html llms.txt; then
            echo "Pages unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anyps5/index.html index.html llms.txt
          git commit -m "AnyPS5 contributions: refresh from GitHub"
          git push
