<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LudusCtrl</title>
<style>
  :root { --bg:#fff; --fg:#1a1d23; --muted:#5c6470; --accent:#1b6fc4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0e14; --fg:#e8edf5; --muted:#8a94a6; --accent:#2e9bff; }
  }
  body {
    margin:0; padding:4rem 1.25rem; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  main { max-width:34rem; margin:0 auto; }
  h1 { font-size:2rem; margin:0 0 .5rem; letter-spacing:-.01em; }
  p { color:var(--muted); }
  a { color:var(--accent); }
  ul { padding-left:1.1rem; }
</style>
<main>
  <h1>LudusCtrl</h1>
  <p>
    Use a Bluetooth gamepad on a PC that has no Bluetooth radio. Your phone does
    the pairing and forwards input over your own Wi-Fi to a small receiver on
    Windows. No video streaming, nothing leaves your network.
  </p>
  <ul>
    <li><a href="docs/privacy.html">Privacy policy</a></li>
  </ul>
</main>
